name: myexpence
description: "MyExpense - Intelligent, Offline-First Personal and Family Expense Management Application."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  go_router: ^14.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  receive_sharing_intent: ^1.4.5
  google_mlkit_text_recognition: ^0.17.1
  local_auth: ^3.0.2
  archive: ^3.6.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.1.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/default_categories.json
    - assets/config/firebase_service_account.json
